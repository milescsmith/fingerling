[package]
name = "fingerling"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fingerling"
crate-type = ["cdylib"]

[dependencies]
byteorder = "1.5.0"
flate2 = "1.1.2"
pyo3 = {version = "0.25.1", features = ["abi3-py312"]}